[project]
name = "gyygeo-data-service"
version = "0.1.0"
description = "Data acquisition and render-ready raster preparation service for gyygeo."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "rasterio>=1.3",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007"]

